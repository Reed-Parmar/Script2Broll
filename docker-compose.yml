services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: script2broll
      POSTGRES_PASSWORD: script2broll
      POSTGRES_DB: script2broll
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U script2broll"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
